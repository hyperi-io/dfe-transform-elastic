    data_stream: machine_action
    pipelines: microsoft_defender_endpoint/machine_action
    fixtures: microsoft_defender_endpoint/machine_action
    intakes: [beats, fetcher]
    transforms: [default]

  microsoft_defender_endpoint_vulnerability:
    package: microsoft_defender_endpoint
    data_stream: vulnerability
    pipelines: microsoft_defender_endpoint/vulnerability
    fixtures: microsoft_defender_endpoint/vulnerability
    intakes: [beats, fetcher]
    transforms: [default]

  # Three streams on one websocket feed -- a pure transport, so dfe-fetcher can
