  # The pipeline groks a whole RFC 5424 line out of `message`, so a syslog
  # delivery must leave the header on.
  checkpoint:
    package: checkpoint
    data_stream: firewall
    pipelines: checkpoint/firewall
    fixtures: checkpoint/firewall
    beats: {module: checkpoint, fileset: firewall}
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  # `entity-analytics` is a pure transport -- it pages the Graph API and hands
  # the JSON straight to the pipeline -- so dfe-fetcher can obtain the same
  # bytes. `device` and `user` carry no pipeline of their own; the entity
  # stream's sub-pipelines route into them.
  entityanalytics_entra_id:
    package: entityanalytics_entra_id
    data_stream: entity
    pipelines: entityanalytics_entra_id/entity
    fixtures: entityanalytics_entra_id/entity
    intakes: [beats, fetcher]
    transforms: [default, device, user]

  # Every stream is on cel or httpjson -- pure transports, so dfe-fetcher can
  # obtain the same bytes the agent would.
  mimecast_archive_search_logs:
    package: mimecast
    data_stream: archive_search_logs
    pipelines: mimecast/archive_search_logs
    fixtures: mimecast/archive_search_logs
    intakes: [beats, fetcher]
    transforms: [default]

  mimecast_audit_events:
    package: mimecast
    data_stream: audit_events
    pipelines: mimecast/audit_events
    fixtures: mimecast/audit_events
