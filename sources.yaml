    data_stream: siem_logs
    pipelines: mimecast/siem_logs
    fixtures: mimecast/siem_logs
    intakes: [beats, fetcher]
    # Two feed versions, each its own pipeline behind the default's routing.
    transforms: [default, v1_pipeline, v2_pipeline]

  mimecast_threat_intel_malware_customer:
