    data_stream: ttp_url_logs
    pipelines: mimecast/ttp_url_logs
    fixtures: mimecast/ttp_url_logs
    intakes: [beats, fetcher]
    transforms: [default]


  # Two data streams from two different Windows subsystems: `analytical` is the
  # per-query ETW trace, `audit` the change log from the Windows event log.
  # Neither agent input is a pure transport and neither is pushed by a device,
  # so both are Beats-only.
  microsoft_dnsserver_analytical:
    package: microsoft_dnsserver
    data_stream: analytical
    pipelines: microsoft_dnsserver/analytical
    fixtures: microsoft_dnsserver/analytical
    intakes: [beats]
    transforms: [default]

  microsoft_dnsserver_audit:
    package: microsoft_dnsserver
    data_stream: audit
    pipelines: microsoft_dnsserver/audit
    fixtures: microsoft_dnsserver/audit
    intakes: [beats]
    transforms: [default]

  o365:
    package: o365
    data_stream: audit
    pipelines: o365
    fixtures: o365/audit
    beats: {module: o365, fileset: audit}
    intakes: [beats, fetcher]
    transforms: [default]

  okta:
    package: okta
    data_stream: system
    pipelines: okta
    fixtures: okta/system
    beats: {module: okta, fileset: system}
    intakes: [beats, fetcher]
    transforms: [default]

  # `panw.default` routes on log type and holds the CSV parse and the converts
  # the per-type entries depend on. The per-type entries suit a feed already
  # narrowed to one log type.
  panw:
    package: panw
    data_stream: panos
    pipelines: panw
    fixtures: panw/panos
    beats: {module: panw, fileset: panos}
    intakes: [beats, receiver]
    framing: body
    transforms:
      - authentication
      - correlated_event
      - decryption
      - default
      - globalprotect
      - gtp
      - hipmatch
      - ip_tag
      - sctp
      - system
      - traffic
      - tunnel_inspection
      - userid
