  # takes `receiver`. The package ships more data streams than this; these
  # 37 are the ones with an ingest pipeline.
  aws_apigateway_logs:
    package: aws
    data_stream: apigateway_logs
    pipelines: aws/apigateway_logs
    fixtures: aws/apigateway_logs
    intakes: [beats, fetcher]
    transforms: [default]

