  # iis ships application_pool, webserver, website as well. None of them
  # carries an ingest pipeline, so none of them gets an entry.
  # The manifest input is logfile, which is neither a pure transport nor
  # something a device pushes, so Beats is the only intake.
  iis_access:
    package: iis
    data_stream: access
    pipelines: iis/access
    fixtures: iis/access
    intakes: [beats]
    transforms: [default]

