    data_stream: log
    pipelines: fortinet
    fixtures: fortinet/fortigate
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  # Four streams, all on httpjson or cel -- pure transports, so dfe-fetcher can
  # obtain the same bytes the agent would.
  microsoft_defender_endpoint_log:
    package: microsoft_defender_endpoint
    data_stream: log
    pipelines: microsoft_defender_endpoint/log
    fixtures: microsoft_defender_endpoint/log
    intakes: [beats, fetcher]
    transforms: [default]

