#
# Every source this service transforms, and everything about it that its name
# does not tell you. Four places used to carry their own copy of this and drift
# apart: the compat capture, the pipeline vendoring, the regeneration driver and
# the service registry. They all read this file now.
#
# Nothing here is derivable. Fortinet's package is `fortinet_fortigate` while
# its fixtures sit under `fortigate`; one azure package is four of our modules;
# cisco_meraki's pipelines are at `cisco/meraki` and its fixtures at
# `cisco/meraki/logs`.
#
# Keys, per source:
#
#   package      Integration package directory in elastic/integrations.
#   data_stream  Data stream directory within that package.
#   pipelines    Directory under -dev/pipelines/ holding the vendored copy.
#   fixtures     Directory under tests/fixtures/.
#   beats        Beats module and fileset carrying the same source, if any.
#   intakes      Every way this source's payload can reach the service. The
#                transform is the same for all of them; only the wrapper
#                differs, and `src/envelope.rs` unwraps it.
#   framing      Receiver intakes only. `line` if the pipeline groks the
#                syslog header out of `message`, `body` if a prefixed header
#                would corrupt its first field.
#   transforms   Generated transforms wired into the registry, as
#                `filebeat.<source>.<transform>`.
#
# The three intakes, and what earns each:
#
#   beats    Beats or Elastic Agent. Always, since every source here has an
#            Elastic integration.
#   receiver A device pushes the data, so dfe-receiver can take it on any of
#            its transports. The integration says so by shipping tcp/udp
#            agent streams.
#   fetcher  Elastic's agent input is a PURE TRANSPORT -- httpjson, cel,
#            aws-s3, azure-eventhub, streaming -- so the ingest pipeline does
#            all the parsing and dfe-fetcher can obtain the same bytes. These
#            are the sources where the agent adds nothing we would lose.

sources:
  azure_activitylogs:
    package: azure
    data_stream: activitylogs
    pipelines: azure/activitylogs
    fixtures: azure/activitylogs
    beats: {module: azure, fileset: activitylogs}
    intakes: [beats, fetcher]
    transforms: [default]

  azure_auditlogs:
    package: azure
    data_stream: auditlogs
    pipelines: azure/auditlogs
    fixtures: azure/auditlogs
    beats: {module: azure, fileset: auditlogs}
    intakes: [beats, fetcher]
    transforms: [default]

  azure_platformlogs:
    package: azure
    data_stream: platformlogs
    pipelines: azure/platformlogs
    fixtures: azure/platformlogs
    beats: {module: azure, fileset: platformlogs}
    intakes: [beats, fetcher]
    transforms: [default]

  azure_signinlogs:
    package: azure
    data_stream: signinlogs
    pipelines: azure/signinlogs
    fixtures: azure/signinlogs
    beats: {module: azure, fileset: signinlogs}
    intakes: [beats, fetcher]
    transforms: [default]

  cisco_asa:
    package: cisco_asa
    data_stream: log
    pipelines: cisco/asa
    fixtures: cisco/asa
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  cisco_ftd:
    package: cisco_ftd
    data_stream: log
    pipelines: cisco/ftd
    fixtures: cisco/ftd
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  cisco_ios:
    package: cisco_ios
    data_stream: log
    pipelines: cisco/ios
    fixtures: cisco/ios
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  cisco_meraki:
    package: cisco_meraki
    data_stream: log
    pipelines: cisco/meraki
    fixtures: cisco/meraki/logs
    intakes: [beats, receiver]
    framing: body
    transforms: [default]

  cisco_nexus:
    package: cisco_nexus
    data_stream: log
    pipelines: cisco/nexus
    fixtures: cisco/nexus
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  # Delivered as CSV out of an S3 bucket, not by a device over syslog.
  cisco_umbrella:
    package: cisco_umbrella
    data_stream: log
    pipelines: cisco/umbrella
    fixtures: cisco/umbrella
    intakes: [beats, fetcher]
    transforms: [default]

  crowdstrike:
    package: crowdstrike
    data_stream: falcon
    pipelines: crowdstrike
    fixtures: crowdstrike/falcon
    beats: {module: crowdstrike, fileset: falcon}
    intakes: [beats, fetcher]
    transforms: [default]

  fortinet:
    package: fortinet_fortigate
    data_stream: log
    pipelines: fortinet
    fixtures: fortinet/fortigate
    intakes: [beats, receiver]
    framing: line
    transforms: [default]

  # Two data streams from two different Windows subsystems: `analytical` is the
  # per-query ETW trace, `audit` the change log from the Windows event log.
  # Neither agent input is a pure transport and neither is pushed by a device,
  # so both are Beats-only.
  microsoft_dnsserver_analytical:
    package: microsoft_dnsserver
    data_stream: analytical
    pipelines: microsoft_dnsserver/analytical
    fixtures: microsoft_dnsserver/analytical
    intakes: [beats]
    transforms: [default]

  microsoft_dnsserver_audit:
    package: microsoft_dnsserver
    data_stream: audit
    pipelines: microsoft_dnsserver/audit
    fixtures: microsoft_dnsserver/audit
    intakes: [beats]
    transforms: [default]

  o365:
    package: o365
    data_stream: audit
    pipelines: o365
    fixtures: o365/audit
    beats: {module: o365, fileset: audit}
    intakes: [beats, fetcher]
    transforms: [default]

  okta:
    package: okta
    data_stream: system
    pipelines: okta
    fixtures: okta/system
    beats: {module: okta, fileset: system}
    intakes: [beats, fetcher]
    transforms: [default]

  # `panw.default` routes on log type and holds the CSV parse and the converts
  # the per-type entries depend on. The per-type entries suit a feed already
  # narrowed to one log type.
  panw:
    package: panw
    data_stream: panos
    pipelines: panw
    fixtures: panw/panos
    beats: {module: panw, fileset: panos}
    intakes: [beats, receiver]
    framing: body
    transforms:
      - authentication
      - correlated_event
      - decryption
      - default
      - globalprotect
      - gtp
      - hipmatch
      - ip_tag
      - sctp
      - system
      - traffic
      - tunnel_inspection
      - userid
