- kind: transform
  name: elastic
  description: 'Elastic ingest-pipeline logic compiled to native Rust: field extraction, mutation and enrichment applied per event, selected by source name.'
  maturity: beta
  fields:
  - name: source.name
    type: string
    required: true
    description: Which compiled transform to apply, e.g. filebeat.okta.default.
  - name: source.envelope
    type: enum
    required: false
    description: How the payload is wrapped on the way in. `syslog` reads dfe-receiver's output and applies only to device sources.
    enum_values:
    - beats
    - syslog
  children:
