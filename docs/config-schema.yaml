$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: Top-level service configuration.
type: object
properties:
  source:
    description: |-
      Inbound side.

      Defaulted so an instance nothing has configured yet still PARSES and
      reaches the idle gate. Without it the process dies on a missing
      `source` field before `ServiceRuntime::build`, so no `/livez` or
      `/readyz` is serving when it exits and the pod crash-loops.
    $ref: '#/$defs/SourceConfig'
    default:
      name: ''
      transport: bus
      listen: 0.0.0.0:6000
      envelope: auto
      topics: []
      batch_size: 20000
      max_batch_bytes: 16777216
      group_id: ''
      brokers: []
      acknowledgements:
        enabled: true
  sink:
    description: Outbound side.
    $ref: '#/$defs/SinkConfig'
    default:
      topic: ''
      transport: bus
      endpoint: http://dfe-loader:6000
      brokers: null
      max_message_bytes: 15728640
  geoip:
    description: |-
      Which MMDB databases the geoip processors read, and how to obtain them.

      scalo's type verbatim: provisioning is shared across the fleet, and the
      lookup engine and its cache stay in `dfe-runtime`. Read once at startup,
      so a change needs a restart.
    $ref: '#/$defs/GeoIpConfig'
    default:
      enabled: true
      provider: db_ip_lite
      city_db_path: null
      asn_db_path: null
      auto_download:
        enabled: true
        data_dir: /var/lib/geoip
        maxmind_account_id: null
        maxmind_license_key: null
        ipinfo_token: null
        max_age_days: 30
$defs:
  SourceConfig:
    description: Inbound configuration.
    type: object
    properties:
      name:
        description: Beats or Agent source whose transform to apply, e.g. `filebeat.okta`.
        type: string
      transport:
        description: |-
          Which transport the inbound side uses: `bus` consumes `topics`, `direct`
          accepts pushes on `listen`.
        $ref: '#/$defs/Transport'
        default: bus
      listen:
        description: |-
          Address the Push listener binds on the direct transport, ignored on the
          bus. The listener speaks plaintext gRPC with no authentication of its
          own, so it belongs behind the mesh route dfe-infra provisions and never
          on an interface reachable from outside the cluster.
        type: string
        default: 0.0.0.0:6000
      envelope:
        description: |-
          Which producer wrapped the payload. The transform is the same for all
          of them; only the unwrapping differs.

          Defaults to `auto`, which reads it off each event. Naming a family
          instead pins it, and validation then rejects one the source cannot
          actually arrive in.
        $ref: '#/$defs/EnvelopeSetting'
        default: auto
      topics:
        description: Topics to consume.
        type: array
        items:
          type: string
      batch_size:
        description: Events pulled per batch.
        type: integer
        format: uint
        minimum: 0
        default: 20000
      max_batch_bytes:
        description: |-
          Ceiling on the BYTES one fetch may bring back, the inbound mirror of
          `sink.max_message_bytes`.

          `batch_size` bounds the event count and nothing bounds their size, so a
          producer sending large records decides this service's memory. Applied as
          librdkafka's `fetch.max.bytes`, which enforces it at the broker rather
          than after the bytes have arrived; the pod's memory limit has to cover
          this plus the parsed document trees, which are several times larger.
        type: integer
        format: uint
        minimum: 0
        default: 16777216
      group_id:
        description: Kafka consumer group.
        type: string
      brokers:
        description: Broker list.
        type: array
        items:
          type: string
      acknowledgements:
        description: |-
          When the source is told its records are safe: a Kafka offset commit on
          the bus, the answer to a push on direct.

          `enabled: true`, the default, holds it until every event built from a
          record is delivered, or dropped and counted, so a crash or a sink outage
          redelivers rather than loses. `enabled: false` releases it at receipt,
          before the transform runs, and loses what was in flight.
        $ref: '#/$defs/AcknowledgementsConfig'
        default:
          enabled: true
    required:
    - name
    - topics
    - group_id
    - brokers
  Transport:
    description: |-
      Which transport a side of the service uses.

      `bus` is Kafka between the stages; `direct` is a scalo Push listener inbound and a gRPC client outbound, needing no broker at all. The record and the transform are identical either way -- only who hands the record over changes. `kafka` and `grpc` are read as the same two, the names dfe-engine renders, and a config always writes `bus` and `direct` back.
    oneOf:
    - description: Kafka topics.
      type: string
      enum:
      - bus
      - kafka
    - description: A scalo Push listener inbound, a gRPC client outbound.
      type: string
      enum:
      - direct
      - grpc
  EnvelopeSetting:
    description: |-
      What the operator said about the envelope.

      `auto` is the default: the family is read off the first event of each batch,
      so a deployment that changes producer needs no config change. Naming one
      pins it, which is the way through for a shape that carries no marker.
    oneOf:
    - description: Detect the family from each batch's first event.
      type: string
      const: auto
    - description: Beats, Elastic Agent, or anything passed through unaltered.
      type: string
      const: beats
    - description: dfe-receiver, on any of its transports.
      type: string
      const: receiver
    - description: dfe-fetcher.
      type: string
      const: fetcher
  AcknowledgementsConfig:
    description: |-
      The `acknowledgements` section of an ack-capable transport.

      With `enabled: true` (the default) a source releases its acknowledgement --
      a Kafka offset commit, a gRPC or HTTP response -- only once every piece of
      work built from the record has been delivered, dead-lettered with the DLQ's
      confirmation, or dropped by policy. A failed delivery withholds it, so the
      record is delivered again: duplicates are possible, loss is not.

      With `enabled: false` the source acknowledges at receipt, before the record
      is processed: a crash or a failed delivery loses what was acknowledged.

      ```yaml
      kafka:
        acknowledgements:
          enabled: true
      ```
    type: object
    properties:
      enabled:
        description: Hold the source acknowledgement until every piece is delivered.
        type: boolean
        default: true
  SinkConfig:
    description: Outbound configuration.
    type: object
    properties:
      topic:
        description: |-
          Where the events land: the topic produced to on the bus, and the
          routing key every push carries on direct. Required on both.
        type: string
      transport:
        description: |-
          Which transport the outbound side uses: `bus` produces to `topic`,
          `direct` pushes to `endpoint` with `topic` as the routing key.
        $ref: '#/$defs/Transport'
        default: bus
      endpoint:
        description: |-
          Downstream Push listener on the direct transport, ignored on the bus.
          Reached in the clear, so it too stays inside the mesh.
        type: string
        default: http://dfe-loader:6000
      brokers:
        description: Broker list. Defaults to the source brokers when unset.
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
      max_message_bytes:
        description: |-
          Ceiling on one outbound record. An event that serialises larger is
          dropped and counted on `events_oversize_total`.

          The default fits the stack's 16 MiB record ceiling. Against a broker or
          topic whose `message.max.bytes` is lower, set this below that limit, or
          the broker refuses those events instead and they count on
          `send_filtered_dlq_total`.
        type: integer
        format: uint
        minimum: 0
        default: 15728640
    required:
    - topic
  GeoIpConfig:
    description: |-
      GeoIP database provisioning configuration.

      `PartialEq` is part of the contract: a consumer nests this inside its own
      config and compares old against new to decide whether a reload needs a
      restart. Comparing serialised forms instead would read every credential
      change as no change, because [`SensitiveString`] redacts in `Serialize`.
    type: object
    properties:
      enabled:
        description: |-
          Provision databases at all. Defaults to true: calling
          [`ensure_databases`](super::ensure_databases) is the opt-in, so this is
          the config-side opt-out for an app that wires the call unconditionally.
        type: boolean
        default: true
      provider:
        description: Where the databases come from.
        $ref: '#/$defs/GeoIpProvider'
        default: db_ip_lite
      city_db_path:
        description: |-
          Explicit city MMDB path. Set on either path field and the provider is
          bypassed entirely -- nothing is downloaded and nothing is checked.
        type:
        - string
        - 'null'
        default: null
      asn_db_path:
        description: Explicit ASN MMDB path. See [`city_db_path`](Self::city_db_path).
        type:
        - string
        - 'null'
        default: null
      auto_download:
        description: Auto-download settings.
        $ref: '#/$defs/AutoDownloadConfig'
        default:
          enabled: true
          data_dir: /var/lib/geoip
          maxmind_account_id: null
          maxmind_license_key: null
          ipinfo_token: null
          max_age_days: 30
  GeoIpProvider:
    description: |-
      Source of the MMDB databases.

      | Variant | Auth | City | ASN |
      |---|---|---|---|
      | [`DbIpLite`](Self::DbIpLite) | none | yes | yes |
      | [`MaxMindGeoLite2`](Self::MaxMindGeoLite2) | HTTP basic | yes | yes |
      | [`IpLocate`](Self::IpLocate) | none | no | yes |
      | [`IpInfoLite`](Self::IpInfoLite) | token | yes | no |
      | [`Sapics`](Self::Sapics) | none | no | yes |
      | [`Custom`](Self::Custom) | n/a | explicit path | explicit path |
    oneOf:
    - description: DB-IP Lite -- free, anonymous download, city-level, CC BY 4.0.
      type: string
      const: db_ip_lite
    - description: MaxMind GeoLite2 -- free account required (account id + licence key).
      type: string
      const: max_mind_geo_lite2
    - description: IPLocate.io -- free, anonymous, country + ASN only.
      type: string
      const: ip_locate
    - description: IPinfo Lite -- free token required, country + ASN only.
      type: string
      const: ip_info_lite
    - description: sapics/ip-location-db -- free CC0, country + ASN only.
      type: string
      const: sapics
    - description: Caller supplies the MMDB paths directly; nothing is downloaded.
      type: string
      const: custom
  AutoDownloadConfig:
    description: |-
      Auto-download settings.

      The three credential fields are [`SensitiveString`], so they are redacted
      in `Debug` output and in any serialised form (config dumps, JSON schema
      examples, error reports). Only the download call itself exposes them.
    type: object
    properties:
      enabled:
        description: |-
          Download a database when the local copy is missing or stale.

          When false, [`ensure_databases`](super::ensure_databases) returns only
          the files that already exist on disk.
        type: boolean
        default: true
      data_dir:
        description: Directory the downloaded MMDB files are written to.
        type: string
        default: /var/lib/geoip
      maxmind_account_id:
        description: |-
          MaxMind account id, required by
          [`GeoIpProvider::MaxMindGeoLite2`].
        type:
        - string
        - 'null'
        x-scalo-secret: true
        writeOnly: true
        default: null
      maxmind_license_key:
        description: |-
          MaxMind licence key, required by
          [`GeoIpProvider::MaxMindGeoLite2`].
        type:
        - string
        - 'null'
        x-scalo-secret: true
        writeOnly: true
        default: null
      ipinfo_token:
        description: IPinfo API token, required by [`GeoIpProvider::IpInfoLite`].
        type:
        - string
        - 'null'
        x-scalo-secret: true
        writeOnly: true
        default: null
      max_age_days:
        description: Age, in days, past which a local database is treated as stale.
        type: integer
        format: uint32
        minimum: 0
        default: 30
