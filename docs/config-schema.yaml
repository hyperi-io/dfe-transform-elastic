$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: Top-level service configuration.
type: object
properties:
  pipeline_name:
    description: Name reported in metrics labels.
    type: string
    default: dfe-transform-elastic
  source:
    description: Inbound side.
    $ref: '#/$defs/SourceConfig'
  sink:
    description: Outbound side.
    $ref: '#/$defs/SinkConfig'
required:
- source
- sink
$defs:
  SourceConfig:
    description: Inbound configuration.
    type: object
    properties:
      name:
        description: Beats or Agent source whose transform to apply, e.g. `filebeat.okta`.
        type: string
      envelope:
        description: |-
          Which producer wrapped the payload. The transform is the same for all
          of them; only the unwrapping differs.

          Defaults to `auto`, which reads it off each batch's first event. Naming
          a family instead pins it, and validation then rejects one the source
          cannot actually arrive in.
        $ref: '#/$defs/EnvelopeSetting'
        default: auto
      topics:
        description: Topics to consume.
        type: array
        items:
          type: string
      batch_size:
        description: Events pulled per batch.
        type: integer
        format: uint
        minimum: 0
        default: 20000
      group_id:
        description: Kafka consumer group.
        type: string
      brokers:
        description: Broker list.
        type: array
        items:
          type: string
    required:
    - name
    - topics
    - group_id
    - brokers
  EnvelopeSetting:
    description: |-
      What the operator said about the envelope.

      `auto` is the default: the family is read off the first event of each batch,
      so a deployment that changes producer needs no config change. Naming one
      pins it, which is the way through for a shape that carries no marker.
    oneOf:
    - description: Detect the family from each batch's first event.
      type: string
      const: auto
    - description: Beats, Elastic Agent, or anything passed through unaltered.
      type: string
      const: beats
    - description: dfe-receiver, on any of its transports.
      type: string
      const: receiver
    - description: dfe-fetcher.
      type: string
      const: fetcher
  SinkConfig:
    description: Outbound configuration.
    type: object
    properties:
      topic:
        description: Topic to produce to.
        type: string
      brokers:
        description: Broker list. Defaults to the source brokers when unset.
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
      max_message_bytes:
        description: |-
          Ceiling on one produced Kafka record. A batch is split into as many
          records as it takes to stay under it.

          Must sit below the LOWER of the broker's `message.max.bytes` and the
          producer's -- raising the broker limit alone does nothing.
        type: integer
        format: uint
        minimum: 0
        default: 900000
    required:
    - topic
