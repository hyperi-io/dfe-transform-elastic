# Repo category. Matches the `classification` custom property on the org.
# Values: internal, product, fork, general-oss
classification: product

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu

# Quality checks
quality:
  enabled: true

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    # The arm64 leg needs a larger runner for MEMORY, not cores. `dfe-transforms`
    # carries one module per data stream and holds 13.15 GiB in a single rustc at
    # opt-level 1; the hosted `ubuntu-24.04-arm` is 2 vCPU and 8 GiB on a private
    # repo, so the build was OOM-killed after 12 minutes. A repo-level
    # `GH_RUNNER_ARM64` points this repo at a 16-core, 64 GiB runner (issue #27).
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # The cost lands on a RELEASE and never on a PR: the build half only runs
    # behind the `Publish: true` trailer or a `hyperi-ci publish` dispatch, so
    # the day-to-day loop is untouched. Release in groups, sparingly.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        # 600 rather than the 300 the sibling services use, because our
        # workload splits its budget across TWO sources -- cisco_ios is grok
        # over syslog, okta is Painless over JSON -- and profiles each
        # separately, so 300 would leave each with 150s. A short run biases the
        # profile toward startup paths, which the loader canary measured as
        # NEGATIVE PGO.
        duration_secs: 600
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

# Publishing (on release). The stack pins every app by GHCR image digest, so
# a release must land an image. The deployed chart is dfe-infra's, so the
# in-repo chart stays unpublished.
publish:
  enabled: true
  target: both
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: false
