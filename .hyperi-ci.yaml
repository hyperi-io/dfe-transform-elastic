# Repo category. Matches the `classification` custom property on the org.
# Values: internal, product, fork, general-oss
classification: product

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu

# Quality checks
quality:
  enabled: true

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    # The arm64 leg needs a larger runner for MEMORY, not cores. `dfe-transforms`
    # carries one module per data stream and holds 13.15 GiB in a single rustc at
    # opt-level 1; the hosted `ubuntu-24.04-arm` is 2 vCPU and 8 GiB on a private
    # repo, so the build was OOM-killed after 12 minutes. A repo-level
    # `GH_RUNNER_ARM64` points this repo at a 16-core, 64 GiB runner (issue #27).
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Publishing (on release). The stack pins every app by GHCR image digest, so
# a release must land an image. The deployed chart is dfe-infra's, so the
# in-repo chart stays unpublished.
publish:
  enabled: true
  target: both
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: false
