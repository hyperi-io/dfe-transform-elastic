# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu

# Quality checks
quality:
  enabled: true

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Publishing (on release)
publish:
  enabled: true
  container:
    enabled: false
  helm:
    enabled: false
