# Repo category. Matches the `classification` custom property on the org.
# Values: internal, product, fork, general-oss
classification: product

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Quality checks
quality:
  enabled: true
  ignore:
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 is in the
    # lock through scalo, in the affected range (<= 0.32.0, fixed in 0.32.1).
    # The flaw is in BaggagePropagator::extract_with_context, which parses an
    # inbound W3C Baggage header before enforcing its size limits. Nothing here
    # reaches it: neither this crate nor scalo names `baggage` or installs a
    # text map propagator. It is a GitHub advisory with no RustSec entry, so
    # only osv-scanner sees it. Drop this when scalo allows
    # opentelemetry_sdk >= 0.32.1 (scalo-rs#34, scalo-rs#100).
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: BaggagePropagator::extract_with_context is unreachable (no text map propagator, no baggage in this crate or scalo). Drop when scalo allows opentelemetry_sdk >= 0.32.1 (scalo-rs#34/#100)."

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  # GA release prep sets this false for every app together. Until then a stable release needs `release-unoptimized: true` at dispatch.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    # The arm64 leg needs a larger runner for MEMORY, not cores. `dfe-transforms`
    # carries one module per data stream and holds 13.15 GiB in a single rustc at
    # opt-level 1; the hosted `ubuntu-24.04-arm` is 2 vCPU and 8 GiB on a private
    # repo, so the build was OOM-killed after 12 minutes. A repo-level
    # `GH_RUNNER_ARM64` points this repo at a 16-core, 64 GiB runner (issue #27).
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # One rustc here peaks near 14 GiB, so the default 2 GiB per cargo job runs 12 jobs on a 24 GiB runner and gets OOM-killed. 6 runs 4.
    memory_per_job_gib: 6
    # The cost lands on a RELEASE and never on a PR: the build half only runs
    # behind the `Publish: true` trailer or a `hyperi-ci publish` dispatch, so
    # the day-to-day loop is untouched.
    optimize:
      pgo:
        enabled: true
        # 600s of load, 300s per source. The prefix holds it there over the duration_secs hyperi-ci exports.
        workload_cmd: "env PGO_WORKLOAD_DURATION_SECS=600 bash scripts/pgo-workload.sh"
        # hyperi-ci's timeout is this plus 600s, which has to cover the driver build and broker pull as well as the load.
        duration_secs: 900
      bolt:
        # GA release prep turns this on with PGO for every app together.
        enabled: false

# Publishing (on release). The stack pins every app by GHCR image digest, so
# a release must land an image. The deployed chart is dfe-infra's, so the
# in-repo chart stays unpublished.
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: false
