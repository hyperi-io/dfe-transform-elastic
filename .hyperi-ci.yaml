classification: product

language: rust

quality:
  enabled: true

test:
  enabled: true
  coverage: true
  rust:
    # Required: the memory and cascade tests need a process each (docs/testing.md).
    nextest: true
  # Logs memory every 30 s, and fails the step with its log on a sustained stall rather than losing the runner.
  memory_watch:
    enabled: true

build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    # librdkafka and OpenSSL link statically, so the image installs no C libraries.
    static_libs: true
    # arm64 builds on the larger runner `GH_RUNNER_ARM64` names, for memory (issue #27).
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # One rustc here peaks near 14 GiB.
    memory_per_job_gib: 14
    # Release builds only, never a PR (CONTRIBUTING.md, "CI is slow here").
    optimize:
      pgo:
        enabled: true
        # The prefix holds the load at 600 s over the duration_secs hyperi-ci exports.
        workload_cmd: "env PGO_WORKLOAD_DURATION_SECS=600 bash scripts/pgo-workload.sh"
        # Built before the workload clock starts.
        workload_setup_cmd: "cargo build --release -p pgo-driver --features driver"
        # hyperi-ci's timeout is this plus 600 s, which covers the broker pull.
        duration_secs: 900
      bolt:
        enabled: true

release:
  enabled: true
  candidates: true
  # Keep `library` at the scalo version in Cargo.toml (CONTRIBUTING.md, "Generated artefacts").
  helm:
    enabled: true
    contract: emit
    library: "2.14.40"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
