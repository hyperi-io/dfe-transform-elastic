# Repo category. Matches the `classification` custom property on the org.
# Values: internal, product, fork, general-oss
classification: product

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu

# Quality checks
quality:
  enabled: true

# Testing
test:
  enabled: true
  coverage: true

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    # amd64 only for now. The arm64 leg runs on GitHub's hosted 4-core arm
    # runner, and the release build of the crate that holds one module per
    # data stream dies there without a log; an arm64 runner with the memory
    # for it is issue #27.
    targets:
      - x86_64-unknown-linux-gnu

# Publishing (on release). The stack pins every app by GHCR image digest, so
# a release must land an image. The deployed chart is dfe-infra's, so the
# in-repo chart stays unpublished.
publish:
  enabled: true
  target: both
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
  helm:
    enabled: false
