name: CI

on:
  # No nightly schedule: no test is #[ignore]d, so core is the full tier (docs/testing.md).
  push:
    branches: ["**"]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - ".gemini/**"
      - "hyperi-ai/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to publish (e.g. v1.3.0)"
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD."
      bump:
        type: string
        required: false
        default: "auto"
        description: "from-head version: auto | patch | minor | X.Y.Z (exact)."
      skip-optimize:
        type: string
        required: false
        default: ""
        description: "'true' to skip the optimisation stage for this run (Rust: no PGO, no BOLT). Empty = optimisation on."
      release-unoptimized:
        type: string
        required: false
        default: ""
        description: "'true' to consent, for this run only, to shipping a skipped-optimisation build under a release tag."
      optimize-tier:
        type: string
        required: false
        default: ""
        description: "'release' to build the release optimisation tier (PGO + BOLT) on a run that publishes nothing. Empty = the tier follows whether the run ships."
      test-tier:
        type: choice
        required: false
        default: "core"
        options: [core, full]
        description: "full runs the full test tier on this run. core never lowers a tier."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      # No runner-quality: a 16 GiB runner kills a 14 GiB rustc. `internal` would demote a release to the spike channel.
      publish-target: both
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      skip-optimize: ${{ inputs.skip-optimize || '' }}
      release-unoptimized: ${{ inputs.release-unoptimized || '' }}
      optimize-tier: ${{ inputs.optimize-tier || '' }}
      # A PGO and BOLT release builds the binary three times.
      build-timeout-minutes: 360
      test-tier: ${{ inputs.test-tier || 'core' }}
    # Least privilege: only the secrets this pipeline uses. No crates.io token, nothing is published there.
    secrets:
      GITLEAKS_GH_ACTIONS_KEY: ${{ secrets.GITLEAKS_GH_ACTIONS_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CONTAINER_MGT_APP_PRIVATE_KEY: ${{ secrets.CONTAINER_MGT_APP_PRIVATE_KEY }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # The engine pins `sources.yaml` from the release, so a release carries it (issue #18).
  # Not on `release: published`: semantic-release's token cannot start a workflow run.
  catalogue-asset:
    name: Source catalogue asset
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Attach sources.yaml to the release this run created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "no release exists yet -- nothing to attach"
            exit 0
          fi
          # Resolve the tag through the API rather than a local ref: the
          # checkout above fetches no tags, and a release from an earlier run
          # must not collect this run's catalogue.
          released="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
          if [[ "$released" != "$GITHUB_SHA" ]]; then
            echo "latest release $tag is $released, not this commit -- nothing published here"
            exit 0
          fi
          gh release upload "$tag" sources.yaml --clobber
          echo "attached sources.yaml to $tag"
