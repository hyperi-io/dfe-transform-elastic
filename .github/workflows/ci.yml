name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - ".gemini/**"
      - "hyperi-ai/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to publish (e.g. v1.3.0)"
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD."
      bump:
        type: string
        required: false
        default: "auto"
        description: "from-head version: auto | patch | minor | X.Y.Z (exact)."
      skip-optimize:
        type: string
        required: false
        default: ""
        description: "'true' to skip the optimisation stage for this run (Rust: no PGO, no BOLT). Empty = optimisation on."
      release-unoptimized:
        type: string
        required: false
        default: ""
        description: "'true' to consent, for this run only, to shipping a skipped-optimisation build under a release tag."
      optimize-tier:
        type: string
        required: false
        default: ""
        description: "'release' to build the release optimisation tier (PGO + BOLT) on a run that publishes nothing. Empty = the tier follows whether the run ships."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      # `both` resolves to the release channel; `internal` is the spike
      # channel and would demote a release build silently.
      publish-target: both
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      skip-optimize: ${{ inputs.skip-optimize || '' }}
      release-unoptimized: ${{ inputs.release-unoptimized || '' }}
      optimize-tier: ${{ inputs.optimize-tier || '' }}
      # A PGO+BOLT release builds the binary three times, ending in a single-threaded LTO pass; one build took over three hours.
      build-timeout-minutes: 360
    # Least privilege: the org carries 31+ secrets and this pipeline uses four.
    # Only names declared in rust-ci.yml's `workflow_call.secrets` can be
    # passed, so an addition there is needed before one can be added here.
    # No crates.io token: the package has binary targets and publishes no
    # crate, so the preflight never asks for one.
    secrets:
      GITLEAKS_GH_ACTIONS_KEY: ${{ secrets.GITLEAKS_GH_ACTIONS_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CONTAINER_MGT_APP_PRIVATE_KEY: ${{ secrets.CONTAINER_MGT_APP_PRIVATE_KEY }}

  # The engine offers `sources.yaml` as its source catalogue and content-pins it
  # the way it pins dfe-schemas, so a release has to carry the file (issue #18).
  # hyperi-ci has no release-asset stanza and this needs no change there: the
  # upload lives in this repo's own workflow.
  #
  # NOT triggered on `release: published` -- semantic-release creates the
  # release with a token whose events cannot start another workflow run, so
  # that trigger would never fire. This gates on the same events that can
  # publish and then proves a release for THIS commit exists before uploading.
  catalogue-asset:
    name: Source catalogue asset
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Attach sources.yaml to the release this run created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "no release exists yet -- nothing to attach"
            exit 0
          fi
          # Resolve the tag through the API rather than a local ref: the
          # checkout above fetches no tags, and a release from an earlier run
          # must not collect this run's catalogue.
          released="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
          if [[ "$released" != "$GITHUB_SHA" ]]; then
            echo "latest release $tag is $released, not this commit -- nothing published here"
            exit 0
          fi
          gh release upload "$tag" sources.yaml --clobber
          echo "attached sources.yaml to $tag"
