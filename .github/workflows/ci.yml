name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - ".gemini/**"
      - "hyperi-ai/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to publish (e.g. v1.3.0)"
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD."
      bump:
        type: string
        required: false
        default: "auto"
        description: "from-head version: auto | patch | minor | X.Y.Z (exact)."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      # `both` resolves to the release channel; `internal` is the spike
      # channel and would demote a release build silently.
      publish-target: both
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
    # Least privilege: the org carries 31+ secrets and this pipeline uses four.
    # Only names declared in rust-ci.yml's `workflow_call.secrets` can be
    # passed, so an addition there is needed before one can be added here.
    # No crates.io token: the package has binary targets and publishes no
    # crate, so the preflight never asks for one.
    secrets:
      GITLEAKS_GH_ACTIONS_KEY: ${{ secrets.GITLEAKS_GH_ACTIONS_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CONTAINER_MGT_APP_PRIVATE_KEY: ${{ secrets.CONTAINER_MGT_APP_PRIVATE_KEY }}
