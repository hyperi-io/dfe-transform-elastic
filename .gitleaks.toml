# Documentation: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

paths = [
    '''(^|/)ci/''',
    '''(^|/)ai/''',
    # Sample logs: invented ids trip the entropy rules.
    '''(^|/)tests/fixtures/''',
    '''(^|/)tests/pipelines/''',
]

regexes = [
    # Meraki event-type literal carried through from the Elastic pipeline.
    '''8021x_eap_failure''',
    # Confluent's public signing-key fingerprint, which the Dockerfile verifies.
    '''CBBB821E8FAF364F79835C438B1DA6120C2BF624''',
]
