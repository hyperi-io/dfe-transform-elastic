[package]
name = "dfe-transform-elastic"
description = "Kafka-to-Kafka transform service for Beats and Elastic Agent data. Runs standalone or as part of the HyperI Data Fusion Engine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
exclude = [".github/", "chart/", "docs/", ".tmp/", "tests/fixtures/"]

[lib]
name = "dfe_transform_elastic"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-elastic"
path = "src/main.rs"

[dependencies]
dfe-runtime = { workspace = true }
dfe-transforms = { workspace = true }
scalo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
metrics = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
# `tests/unicode.rs` runs its sweeps through `dfe_runtime::testutil`, which is
# feature-gated. The dependency above asks for no features, so the module is
# configured out whenever this package is built ALONE -- a whole-workspace
# build only worked because dfe-transforms happens to ask for it.
dfe-runtime = { workspace = true, features = ["testutil"] }
# `start_paused` for the send-retry tests: the attempt budget spans ~25 seconds
# of backoff, which a paused clock fast-forwards instead of waiting out.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "envelope"
harness = false

[features]
default = ["kafka", "grpc"]
# hyperi-ci enables this on spike/alpha/beta/release. Local dev stays on the
# system allocator so `cargo build` is not paying for it.
jemalloc = ["dep:tikv-jemallocator"]
# The Kafka service loop. Separable so the crate still builds and tests on a
# host without librdkafka-dev; needs the LIBRDKAFKA C library at 2.12.1 or
# later when enabled, which is unrelated to the scalo version below.
kafka = ["scalo/transport-kafka"]
# The direct transport: a scalo Push listener inbound, a gRPC client outbound.
# Additive to `kafka` rather than an alternative, and in `default` because the
# release build takes no other feature list and the deployment contract
# declares the listener port the shipped binary must be able to bind.
grpc = ["scalo/transport-grpc"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
members = [
    "crates/dfe-core",
    "crates/dfe-painless",
    "crates/dfe-parse",
    "crates/dfe-runtime",
    "crates/dfe-transforms",
    "crates/pgo-driver",
]
# Edition 2024's resolver. Feature unification is per-target, so a dev- or
# build-dependency's features no longer leak into the normal build.
resolver = "3"

# The member crates ARE the hot path, so they carry the same panic guards the
# root package does. `missing_docs` is deliberately absent: it is a library
# lint, and these crates are internal to a black-box service.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
# A black-box service, not a library. Nothing here goes to crates.io, and
# saying so stops an accidental publish of BUSL-1.1 code.
publish = false
authors = ["HyperI <dev@hyperi.com.au>"]
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-transform-elastic"
rust-version = "1.95"

[workspace.dependencies]
# Workspace crates
dfe-core = { path = "crates/dfe-core" }
dfe-painless = { path = "crates/dfe-painless" }
dfe-parse = { path = "crates/dfe-parse" }
dfe-runtime = { path = "crates/dfe-runtime" }
dfe-transforms = { path = "crates/dfe-transforms" }

# Batteries-included runtime (crates.io) — NEVER a path dependency.
# Features are added when their API is actually referenced, not speculatively.
scalo = { version = ">=2.13.0, <3", features = [
    "cli-service",
    "config",
    "config-schema",
    "deployment",
    "geoip-download",
    "governor",
    "http-server",
    "logger",
    "memory",
    "metrics",
    "scaling",
    "service-metrics",
    "version-check",
] }

# The metric handle types (Counter/Gauge/Histogram) that MetricsManager hands
# back. scalo re-exports the manager, not the facade crate.
metrics = ">=0.24.3, <0.25"

# JSON Schema derivation for the reflectable config contract. Same range as
# scalo's own so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = [
    "std",
    "derive",
    "preserve_order",
] }

# Async runtime
tokio = { version = ">=1.48", features = ["full"] }
tokio-util = ">=0.7, <0.8"

# Zero-copy payload bytes -- the currency handed to the transport sender.
bytes = ">=1.7, <2"

# Global allocator for the binary; behind the `jemalloc` feature.
tikv-jemallocator = ">=0.6, <0.7"

# CLI surface for the service binary.
clap = { version = ">=4.5", features = ["derive"] }

# JSON parsing (SIMD-accelerated)
simd-json = { version = ">=0.14, <0.15", features = ["known-key"] }
serde = { version = ">=1.0", features = ["derive"] }
# preserve_order keeps object keys in DOCUMENT order, which is what
# Elasticsearch's LinkedHashMap-backed ingest documents hold: a Painless
# `toString` of a map renders in that order, and sorted keys diverged on
# every rendered copy aws's cloudtrail writes.
# float_roundtrip parses every float to the nearest double, as Elasticsearch's
# Java parser does; without it a long literal such as 0.10617876052856445 reads
# one ulp low and is written back as ...444.
serde_json = { version = ">=1.0", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = ">=0.10, <0.11"

# SIMD byte search
memchr = ">=2.7"

# The lock in front of the GeoIP cache. std's RwLock carries poisoning and a
# slower uncontended path, and this one is taken on the per-event path across
# one transform thread per Kafka partition. Already in the lockfile through
# scalo, so this adds no supply chain.
parking_lot = ">=0.12.5, <0.13"

# Pre-compiled DFA regex (serialisable, zero-cost startup)
regex-automata = ">=0.4, <0.5"
regex = ">=1.10"

# Backtracking fallback for the vendor patterns `regex` rejects by design --
# lookaround. Only reached when `regex` fails to compile, so the hot path is
# unchanged; without it those patterns silently match nothing. Bounded because
# 0.x minors break, and the floor is the line the tests actually run.
fancy-regex = ">=0.19, <0.20"

# Mozilla's Public Suffix List, compiled in. Elasticsearch's registered_domain
# processor is a PSL lookup, and the last-two-labels heuristic it replaced was
# wrong in both directions: `a.co.uk` came out registered to `co.uk`, and
# `host.tld` got a registered domain Elasticsearch writes nothing for.
psl = ">=2.1"

# Timestamp handling. chrono-tz carries the IANA database, which chrono
# deliberately does not ship: a pipeline configured with `America/Denver`
# needs the offset AT THE EVENT, and that moves with daylight saving.
chrono = { version = ">=0.4, <0.5", features = ["serde"] }
chrono-tz = { version = ">=0.10, <0.11" }

# GeoIP enrichment (mmap for long-running apps, simdutf8 for SIMD UTF-8 validation)
# Upper bound because 0.x minors break: 0.30 turned `Reader::metadata` from a
# field into a method, which `enrichment/geoip.rs` reads as a field.
maxminddb = { version = ">=0.27, <0.28", features = ["mmap", "simdutf8"] }

# Error handling
thiserror = ">=2.0"

# Logging
tracing = ">=0.1, <0.2"

# Hashing
# The 0.11 line returns a `hybrid_array::Array` from `finalize()`, which has no
# `LowerHex`, so the hex formatting these digests feed stops compiling. An open
# upper bound let a fresh resolve pick it and broke the generator's build of
# this crate.
sha1 = ">=0.10, <0.11"
sha2 = ">=0.10, <0.11"
# Bounded for the same reason: 0.x minors break, and 0.23 is what the tests run.
base64 = ">=0.23, <0.24"

# CSV parsing
csv = ">=1.3"

# Testing (used as dev-dependencies in member crates)
criterion = { version = ">=0.5, <0.6", features = ["html_reports"] }
tempfile = ">=3.10, <3.20"

# Scores the compat corpus across cores. A test-only dependency: the service
# gets its parallelism from one transform thread per Kafka partition, and
# nothing in the shipped path uses a work-stealing pool.
rayon = ">=1.10, <2"

# Ephemeral broker for the round-trip test. Same range as the rest of the
# fleet so one version is shared across dfe-receiver, dfe-loader and the
# transform services.
testcontainers = ">=0.27, <0.28"
testcontainers-modules = { version = ">=0.15, <0.16", features = ["kafka"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# One module per data stream means one rustc holding 21.5 GiB at opt-level 3,
# which is more than the 16 GiB build runner has; opt-level 1 holds 13.1 GiB and
# leaves the three transform benches unchanged, because thin LTO re-optimises
# this crate's code at the binary's own opt-level anyway. codegen-units buys no
# memory at all -- every unit is in flight at once, so sixteen small LLVM modules
# total what one big one did -- but it halves the crate's build.
[profile.release.package.dfe-transforms]
opt-level = 1
codegen-units = 16

[profile.bench]
inherits = "release"
debug = true
# `release` strips, which contradicts the `debug` above: the debuginfo is
# emitted and then the symbol table it needs is thrown away, so every frame of
# a backtrace resolves to `<unknown>` and the allocation-site profiler in
# `dfe-transforms/benches/allocations.rs` has nothing to attribute to.
strip = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
