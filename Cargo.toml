[workspace]
members = [
    "crates/dfe-parse",
    "crates/dfe-runtime",
    "crates/dfe-codegen",
    "crates/dfe-transforms",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-transform-elastic"
rust-version = "1.95"

[workspace.dependencies]
# Workspace crates
dfe-parse = { path = "crates/dfe-parse" }
dfe-runtime = { path = "crates/dfe-runtime" }
dfe-codegen = { path = "crates/dfe-codegen" }
dfe-transforms = { path = "crates/dfe-transforms" }

# Batteries-included runtime (crates.io) — NEVER a path dependency.
# Features are added when their API is actually referenced, not speculatively.
scalo = { version = ">=2.10.9, <3", features = ["logger", "memory"] }

# Async runtime
tokio = { version = ">=1.48", features = ["full"] }

# JSON parsing (SIMD-accelerated)
simd-json = { version = ">=0.14, <0.15", features = ["known-key"] }
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
serde_yaml_ng = ">=0.10"

# Parser combinators (zero-copy structured parsing)
winnow = ">=0.6"

# SIMD byte search
memchr = ">=2.7"

# Multi-pattern matching (SIMD Teddy algorithm)
aho-corasick = ">=1.1"

# Pre-compiled DFA regex (serialisable, zero-cost startup)
regex-automata = ">=0.4"
regex = ">=1.10"

# Lexer generation (compile-time DFA)
logos = ">=0.14"

# Timestamp handling
chrono = { version = ">=0.4", features = ["serde"] }

# GeoIP enrichment (mmap for long-running apps, simdutf8 for SIMD UTF-8 validation)
maxminddb = { version = ">=0.24", features = ["mmap", "simdutf8"] }

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0"

# Logging
tracing = ">=0.1"
tracing-subscriber = { version = ">=0.3", features = ["env-filter", "json"] }

# ANTLR4 parser (Painless language)
antlr-rust = "0.3.0-beta"

# Go template engine (for codegen templates)
gtmpl = ">=0.7"

# Hashing
rustc-hash = ">=2.0"
sha1 = ">=0.10"
sha2 = ">=0.10"
base64 = ">=0.22"

# URL parsing
url = ">=2.5"

# CSV parsing
csv = ">=1.3"

# Utilities
uuid = { version = ">=1.10, <1.21", features = ["v4"] }
lazy_static = ">=1.4"
paste = ">=1.0"

# Testing (used as dev-dependencies in member crates)
dotenvy = ">=0.15"
criterion = { version = ">=0.5, <0.6", features = ["html_reports"] }
pretty_assertions = ">=1.4"
proptest = ">=1.5, <1.7"
test-case = ">=3.3"
rstest = ">=0.22"
tempfile = ">=3.10, <3.20"
syn = { version = ">=2.0", features = ["full", "parsing"] }
clap = { version = ">=4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
