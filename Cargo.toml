[package]
name = "dfe-transform-elastic"
description = "Turns Beats and Elastic Agent events into DFE-normalised events."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
exclude = [".github/", "docs/", ".tmp/", "tests/fixtures/"]

[lib]
name = "dfe_transform_elastic"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-elastic"
path = "src/main.rs"

[dependencies]
dfe-runtime = { workspace = true }
dfe-transforms = { workspace = true }
scalo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
aho-corasick = { workspace = true }
metrics = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
parking_lot = { workspace = true }

[dev-dependencies]
# `tests/unicode.rs` needs `testutil`, which a package-alone build leaves off.
dfe-runtime = { workspace = true, features = ["testutil"] }
# `start_paused` fast-forwards the loop tests' retry backoff.
tokio = { workspace = true, features = ["test-util"] }
# An in-process source for the loop tests, and the run's shared Kafka broker.
scalo = { workspace = true, features = [
    "transport-memory",
    "deployment-test-support",
    "transport-kafka-test-support",
] }
tempfile = { workspace = true }
criterion = { workspace = true }
# The parser dfe-receiver runs, so the detector is scored on what it delivers.
syslog_loose = { workspace = true }

[[bench]]
name = "envelope"
harness = false

[[bench]]
name = "detect"
harness = false

[[bench]]
name = "original"
harness = false

[features]
default = ["kafka", "grpc"]
# hyperi-ci enables this on release builds. Local builds use the system allocator.
jemalloc = ["dep:tikv-jemallocator"]
# Needs librdkafka 2.12.1 or later. Off, the crate builds without librdkafka-dev.
kafka = ["scalo/transport-kafka"]
# In `default`: the release build takes no other feature list, and the contract declares the push port.
grpc = ["scalo/transport-grpc"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
members = [
    "crates/dfe-core",
    "crates/dfe-painless",
    "crates/dfe-parse",
    "crates/dfe-runtime",
    "crates/dfe-transforms",
    "crates/dfe-transforms-1password-authentik",
    "crates/dfe-transforms-aws-axonius",
    "crates/dfe-transforms-azure-cisa",
    "crates/dfe-transforms-cisco-cloud",
    "crates/dfe-transforms-cloudflare-extrahop",
    "crates/dfe-transforms-f5-hid",
    "crates/dfe-transforms-hpe-lyve",
    "crates/dfe-transforms-m365-nvidia",
    "crates/dfe-transforms-o365-qnap",
    "crates/dfe-transforms-qualys-stan",
    "crates/dfe-transforms-stormshield-swimlane",
    "crates/dfe-transforms-symantec",
    "crates/dfe-transforms-sysdig-traefik",
    "crates/dfe-transforms-trellix-zoom",
    "crates/dfe-transforms-zscaler",
    "crates/pgo-driver",
]
resolver = "3"

# The member crates are the hot path, so they share the root's panic guards. No `missing_docs`: they are internal.
[workspace.lints.rust]
unsafe_code = "forbid"
# Set by the private repository's CI, which supplies the script-based test modules.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dfe_script_tests)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Stops an accidental crates.io publish of BUSL-1.1 code.
publish = false
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-transform-elastic"
rust-version = "1.95"

[workspace.dependencies]
dfe-core = { path = "crates/dfe-core" }
dfe-painless = { path = "crates/dfe-painless" }
dfe-parse = { path = "crates/dfe-parse" }
dfe-runtime = { path = "crates/dfe-runtime" }
dfe-transforms = { path = "crates/dfe-transforms" }
dfe-transforms-1password-authentik = { path = "crates/dfe-transforms-1password-authentik" }
dfe-transforms-aws-axonius = { path = "crates/dfe-transforms-aws-axonius" }
dfe-transforms-azure-cisa = { path = "crates/dfe-transforms-azure-cisa" }
dfe-transforms-cisco-cloud = { path = "crates/dfe-transforms-cisco-cloud" }
dfe-transforms-cloudflare-extrahop = { path = "crates/dfe-transforms-cloudflare-extrahop" }
dfe-transforms-f5-hid = { path = "crates/dfe-transforms-f5-hid" }
dfe-transforms-hpe-lyve = { path = "crates/dfe-transforms-hpe-lyve" }
dfe-transforms-m365-nvidia = { path = "crates/dfe-transforms-m365-nvidia" }
dfe-transforms-o365-qnap = { path = "crates/dfe-transforms-o365-qnap" }
dfe-transforms-qualys-stan = { path = "crates/dfe-transforms-qualys-stan" }
dfe-transforms-stormshield-swimlane = { path = "crates/dfe-transforms-stormshield-swimlane" }
dfe-transforms-symantec = { path = "crates/dfe-transforms-symantec" }
dfe-transforms-sysdig-traefik = { path = "crates/dfe-transforms-sysdig-traefik" }
dfe-transforms-trellix-zoom = { path = "crates/dfe-transforms-trellix-zoom" }
dfe-transforms-zscaler = { path = "crates/dfe-transforms-zscaler" }

# crates.io, never a path dependency. The floor moves with `release.helm.library` in .hyperi-ci.yaml.
scalo = { version = ">=2.14.34, <3", features = [
    "cli-service",
    "config",
    "config-schema",
    "deployment",
    # The pipeline's dead-letter path, which input that is not JSON takes.
    "dlq",
    "geoip-download",
    "governor",
    "http-server",
    "logger",
    "memory",
    "metrics",
    "scaling",
    "service-metrics",
    # The transport types the config and loop name, whichever transport is compiled in.
    "transport",
    "version-check",
    # BatchEngine and its pipeline builder, which runs the service loop.
    "worker-batch",
] }

# The handle types MetricsManager returns. scalo re-exports the manager, not this crate.
metrics = ">=0.24.6, <0.25"

# Same range as scalo's, so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = [
    "std",
    "derive",
    "preserve_order",
] }

tokio = { version = ">=1.54.1", features = ["full"] }
tokio-util = ">=0.7.20, <0.8"

bytes = ">=1.12.1, <2"

tikv-jemallocator = ">=0.7.0, <0.8"

clap = { version = ">=4.6.7", features = ["derive"] }

# Dev-dependency of dfe-runtime's json_parse bench: docs/architecture.md#event-model.
simd-json = { version = ">=0.19.0, <0.20", features = ["known-key"] }
serde = { version = ">=1.0.229", features = ["derive"] }
# preserve_order keeps Elasticsearch's document key order. float_roundtrip parses floats as Java does.
serde_json = { version = ">=1.0.154", features = ["preserve_order", "float_roundtrip"] }

memchr = ">=2.8.3"

aho-corasick = ">=1.1.5"

# Test only: dfe-receiver's syslog parser.
syslog_loose = ">=0.23.0, <0.24"

# std's RwLock poisons and is slower uncontended, and the GeoIP cache takes this per event.
parking_lot = ">=0.13.0, <0.14"

regex-automata = ">=0.4.18, <0.5"
regex = ">=1.13.1"

# Fallback for the lookaround `regex` rejects. Bounded because 0.x minors break.
fancy-regex = ">=0.20.0, <0.21"

# Elasticsearch's registered_domain is a Public Suffix List lookup.
psl = ">=2.1.248"

# chrono-tz has the IANA database chrono lacks, for a zone's offset at the event.
chrono = { version = ">=0.4.45, <0.5", features = ["serde"] }
chrono-tz = { version = ">=0.10.4, <0.11" }

# Bounded because 0.x minors break.
maxminddb = { version = ">=0.32.0, <0.33", features = ["mmap"] }

thiserror = ">=2.0.21"

tracing = ">=0.1.44, <0.2"

# Bounded because 0.x minors break.
sha1 = ">=0.11.0, <0.12"
sha2 = ">=0.11.1, <0.12"
base64 = ">=0.23.1, <0.24"

csv = ">=1.4.0"

criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
tempfile = ">=3.27.0, <4"

# Test only. The shipped path runs one transform thread per block.
rayon = ">=1.12.0, <2"

# Full debuginfo takes the generated transforms' rustc and the test-binary links past a 16 GiB CI runner.
[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Why opt-level 1: docs/performance.md.
[profile.release.package.dfe-transforms-1password-authentik]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-aws-axonius]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-azure-cisa]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-cisco-cloud]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-cloudflare-extrahop]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-f5-hid]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-hpe-lyve]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-m365-nvidia]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-o365-qnap]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-qualys-stan]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-stormshield-swimlane]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-symantec]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-sysdig-traefik]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-trellix-zoom]
opt-level = 1
codegen-units = 16

[profile.release.package.dfe-transforms-zscaler]
opt-level = 1
codegen-units = 16

[profile.bench]
inherits = "release"
debug = true
# `release` strips, which leaves the allocation profiler no symbols to attribute to.
strip = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
