[package]
name = "dfe-runtime"
description = "Core runtime for dfe-transform-elastic: Event type, Transform trait, enrichment"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testutil = ["dep:serde_yaml_ng"]
# The generator resolves a script to its runner call at generation time by
# asking this crate, so the two paths cannot diverge. The service never
# enables it and never compiles the emitters.
codegen = []

[dependencies]
dfe-parse = { workspace = true }
scalo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
maxminddb = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }
uuid = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
psl = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# `benches/hashing.rs` only. serde_json's preserve_order map is an IndexMap
# with the std hasher, and that bench measures what the hasher costs.
indexmap = { version = "2", default-features = false, features = ["std"] }
# `benches/json_parse.rs` only, which is what demoted it from a runtime
# dependency: both hot-path uses measured slower than serde_json.
simd-json = { workspace = true }

[[bench]]
name = "painless"
harness = false

# The dotted-path accessors. Field plumbing is the hot path -- rename, set and
# append outnumber script and grok by an order of magnitude in the vendored
# pipelines -- so one path walk is the number that multiplies out to a batch.
[[bench]]
name = "event"
harness = false

# What the map's hasher costs, against the lookup it is part of. A measurement,
# not a proposal: serde_json::Map does not let a caller choose the hasher.
[[bench]]
name = "hashing"
harness = false

# Reading the vendor payload, which every JSON-carrying source does first.
# Tests the "simd-json is 2-3x faster" premise against this workload.
[[bench]]
name = "json_parse"
harness = false
