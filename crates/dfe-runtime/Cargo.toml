[package]
name = "dfe-runtime"
description = "Core runtime for dfe-transform-elastic: Event type, Transform trait, enrichment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testutil = []
# Generator-time only: the service never enables it.
codegen = ["dfe-painless/codegen"]

[dependencies]
dfe-core = { workspace = true }
dfe-painless = { workspace = true }
dfe-parse = { workspace = true }
scalo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
maxminddb = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
psl = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# `benches/json_parse.rs` only (docs/architecture.md#event-model).
simd-json = { workspace = true }

# Here, not in dfe-transforms, so the bench builds in minutes.
[[bench]]
name = "grok"
harness = false

# Here, not in dfe-core, because it benches `codegen_api::parse_json_str` too.
[[bench]]
name = "json_parse"
harness = false

# The GeoIP cache hit, on one thread and on eight.
[[bench]]
name = "geoip"
harness = false
