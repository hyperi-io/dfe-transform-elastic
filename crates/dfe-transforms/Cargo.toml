[package]
name = "dfe-transforms"
description = "Transform modules for Elastic data sources: one Rust module per ingest pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# No `[lints] workspace = true` here. The crate is ~200 GENERATED modules, and
# the workspace set flags the generator's own output rather than a defect, so
# adopting it means changing codegen first.

[dependencies]
dfe-parse = { workspace = true }
dfe-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
csv = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# `codegen` so `painless_binding` can ask a plan whether the generator could
# emit it directly, rather than a second copy of the allowlist drifting here.
dfe-runtime = { workspace = true, features = ["testutil", "codegen"] }
# `grok_compiles` proves every pattern reaches one of the two engines the
# runtime dispatches over, so it has to be able to try both itself.
fancy-regex = { workspace = true }
dotenvy = { workspace = true }
serde_yaml_ng = { workspace = true }

# Per-event transform throughput. A 20k batch multiplies whatever one event
# costs, so anything done per event has to be measured, not reasoned about.
[[bench]]
name = "transforms"
harness = false

# Where the allocations go. Timing says a transform is slow; a per-event
# allocation count says why, and it is exact rather than sampled.
[[bench]]
name = "allocations"
harness = false
