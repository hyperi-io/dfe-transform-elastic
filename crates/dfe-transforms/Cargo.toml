[package]
name = "dfe-transforms"
description = "Transform modules for Elastic data sources: one Rust module per ingest pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Its own table: the workspace set flags generated code rather than defects.
[lints.clippy]
all = "warn"

[dependencies]
dfe-runtime = { workspace = true }
dfe-transforms-1password-authentik = { workspace = true }
dfe-transforms-aws-axonius = { workspace = true }
dfe-transforms-azure-cisa = { workspace = true }
dfe-transforms-cisco-cloud = { workspace = true }
dfe-transforms-cloudflare-extrahop = { workspace = true }
dfe-transforms-f5-hid = { workspace = true }
dfe-transforms-hpe-lyve = { workspace = true }
dfe-transforms-m365-nvidia = { workspace = true }
dfe-transforms-o365-qnap = { workspace = true }
dfe-transforms-qualys-stan = { workspace = true }
dfe-transforms-stormshield-swimlane = { workspace = true }
dfe-transforms-symantec = { workspace = true }
dfe-transforms-sysdig-traefik = { workspace = true }
dfe-transforms-trellix-zoom = { workspace = true }
dfe-transforms-zscaler = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
csv = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# `codegen` lets `painless_binding` ask a plan whether it could be emitted directly.
dfe-runtime = { workspace = true, features = ["testutil", "codegen"] }
# `grok_compiles` tries both engines the runtime dispatches over.
fancy-regex = { workspace = true }
rayon = { workspace = true }
# `dynamic_fields` patterns are Go regexp, so the linear-time engine matches them.
regex = { workspace = true }
# Fixture and pipeline YAML parses with the rules the service reads YAML by.
scalo = { workspace = true }

# Per-event transform throughput.
[[bench]]
name = "transforms"
harness = false

# Allocations per event, counted exactly.
[[bench]]
name = "allocations"
harness = false
