# Project:   dfe-transform-elastic
# File:      crates/dfe-core/Cargo.toml
# Purpose:   Core primitives: the Event document, its error type, the date and
#            syslog parsers, and the regex cache
# Language:  TOML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-core"
description = "Event document, error type and the primitives dfe-painless and dfe-runtime share"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# `benches/hashing.rs` only.
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }

# The dotted-path accessors, the hottest path.
[[bench]]
name = "event"
harness = false

# What the map's hasher costs. serde_json::Map does not let a caller choose it.
[[bench]]
name = "hashing"
harness = false

# What a `date` processor costs per event.
[[bench]]
name = "date_formats"
harness = false

# The JSON codec on the record path: one decode in, one encode out, per record.
[[bench]]
name = "codec"
harness = false

