[package]
name = "pgo-driver"
description = "Load driver that feeds the committed Beats fixtures to a PGO-instrumented dfe-transform-elastic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# hyperi-ci skips a bin with `required-features`, which keeps this driver out of a release.
driver = []

[[bin]]
name = "pgo-driver"
path = "src/main.rs"
required-features = ["driver"]

[dependencies]
# The Kafka transport alone, so the driver builds in minutes.
scalo = { version = "2.14.30", default-features = false, features = [
    "transport-kafka",
] }
serde_json = { workspace = true }
memchr = { workspace = true }
