apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-transform-elastic.fullname" . }}
  labels:
    {{- include "dfe-transform-elastic.labels" . | nindent 4 }}
spec:
  {{- if not (or (and .Values.keda.enabled .Values.keda.cpu.enabled) (and .Values.autoscaling.enabled (not .Values.keda.enabled))) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-transform-elastic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-transform-elastic.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dfe-transform-elastic.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--config"
            - "/etc/dfe-transform-elastic/config.yaml"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if eq (toString ((.Values.config).source).transport) "direct" }}
            - name: push
              containerPort: 6000
              protocol: TCP
            {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: "dfe-transform-elastic"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)
            {{- if (.Values.otel).endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            {{- end }}
            # The wire protocol. librdkafka only presents SASL credentials when
            # this names a SASL mechanism, so leaving it unset connects
            # anonymously in the clear with the secret mounted and unused.
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            {{- if .Values.kafka.saslMechanism }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.kafka.saslMechanism | quote }}
            {{- end }}
            # An empty string counts as a credential, so the secret is projected
            # only when there is actually one to project -- otherwise an
            # unauthenticated broker cannot be configured at all.
            {{- if or .Values.kafka.existingSecret .Values.kafka.password }}
            # kafka credentials via Secret (figment env cascade overrides file config)
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-transform-elastic.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.username }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-transform-elastic.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.password }}
            {{- end }}
            # A grok miss is normal on a device that mixes formats, and scalo's
            # throttle is off unless asked for.
            - name: LOG_THROTTLE_ENABLED
              value: {{ .Values.logThrottle.enabled | quote }}
            - name: LOG_THROTTLE_BURST
              value: {{ .Values.logThrottle.burst | quote }}
            - name: LOG_THROTTLE_RATE
              value: {{ .Values.logThrottle.rate | quote }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-transform-elastic
              readOnly: true
            {{- if (.Values.config.geoip).auto_download }}
            # The downloader writes here, and the root filesystem is read-only.
            - name: geoip
              mountPath: {{ .Values.config.geoip.auto_download.data_dir | quote }}
            {{- end }}
            - name: scratch
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-transform-elastic.fullname" . }}-config
        {{- if (.Values.config.geoip).auto_download }}
        - name: geoip
          emptyDir:
            sizeLimit: {{ .Values.geoip.sizeLimit }}
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
