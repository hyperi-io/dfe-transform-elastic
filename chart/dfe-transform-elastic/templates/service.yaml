apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-transform-elastic.fullname" . }}
  labels:
    {{- include "dfe-transform-elastic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if eq (toString ((.Values.config).source).transport) "direct" }}
    - port: 6000
      targetPort: 6000
      protocol: TCP
      name: push
    {{- end }}
  selector:
    {{- include "dfe-transform-elastic.selectorLabels" . | nindent 4 }}
