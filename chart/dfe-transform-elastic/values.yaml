# dfe-transform-elastic Helm chart values
#
# Generated by scalo deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-elastic
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- OTLP export target. Only consulted by an app built with scalo's
# otel features; ignored otherwise. Empty leaves the app's own default
# in place rather than switching anything off. Example:
# http://opentelemetry-collector.observability:4317
# Spans can carry request attributes, so keep this in-cluster. To leave
# the cluster use https:// and set the OTel SDK's certificate env vars.
otel:
  endpoint: ""
  protocol: grpc

# -- Pod-level security context. Matches the uid the generated image
# switches to; change both together or the container will not start.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. This service spools nowhere: the
# only writable paths are the GeoIP volume and the scratch volume below,
# so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Memory has to cover one inbound fetch (config.source.max_batch_bytes,
# 16 MiB) parsed into document trees, which are several times the raw
# bytes, plus the outbound chunks and the GeoIP cache. Raise both together
# with max_batch_bytes.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe-transform-elastic/config.yaml)
config:
  pipeline_name: dfe-transform-elastic
  source:
    name: filebeat.okta.default
    envelope: auto
    topics:
    - raw_events
    batch_size: 20000
    max_batch_bytes: 16777216
    group_id: dfe-transform-elastic
    brokers:
    - kafka:9092
  sink:
    topic: normalised_events
    brokers:
    - kafka:9092
    max_message_bytes: 900000
  geoip:
    enabled: true
    provider: db_ip_lite
    auto_download:
      enabled: true
      data_dir: /var/lib/dfe/geoip
      max_age_days: 30
  scaling:
    enabled: true
    memory_gate_threshold: 0.8

# -- kafka wire protocol and credentials.
#
# securityProtocol is NOT optional: librdkafka only presents SASL
# credentials when the protocol names a SASL mechanism, so leaving it at
# librdkafka's `plaintext` default connects anonymously in the clear
# while the secret sits mounted and unused. The service refuses that
# pairing at startup rather than running with it.
#
# Leave username and password empty (and existingSecret unset) for an
# unauthenticated broker, and set securityProtocol to `plaintext` with
# it -- credentials and protocol have to agree in both directions.
kafka:
  securityProtocol: sasl_ssl
  saslMechanism: SCRAM-SHA-512
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- Where the GeoIP databases are written. `config.geoip.auto_download`
# downloads them at startup, and the root filesystem is read-only, so this
# volume has to exist or 14 of the source pipelines enrich to nothing. Use
# a PVC instead to stop every new pod re-downloading.
geoip:
  sizeLimit: 512Mi

# -- Scratch space for anything that writes a temporary file under a
# read-only root.
scratch:
  sizeLimit: 64Mi

# -- Log deduplication. A device that mixes formats misses grok on most of
# a batch, and scalo's throttle is off by default.
logThrottle:
  enabled: true
  burst: 50
  rate: "1.0"

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "200000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
