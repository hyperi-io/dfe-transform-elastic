# Cargo build configuration for dfe-transform-elastic
#
# Why these targets: docs/performance.md.

# x86_64: AVX2, BMI1/2, FMA -- Haswell and later.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# mold: a PGO build overflows AArch64's direct branch range under bfd, and lld is not on the runners (hyperi-io/hyperi-ci#142).
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic", "-C", "link-arg=-fuse-ld=mold"]

# Untargeted local builds. CI passes `--target`, so the sections above win there.
[build]
rustflags = ["-C", "target-cpu=native"]
