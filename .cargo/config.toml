# Cargo build configuration for dfe-transform-elastic
#
# Target platforms: Linux x86_64 and aarch64 only.
# SIMD matters here: simd-json, memchr and aho-corasick all dispatch on it.

# x86_64: AVX2, BMI1/2, FMA -- Haswell and later.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# aarch64: NEON is baseline, so generic already has it.
#
# mold rather than the default bfd, because a PGO-instrumented build of this
# binary overflows AArch64's 128 MB direct branch and bfd cannot reach past it
# (hyperi-io/hyperi-ci#142). mold inserts the range-extension thunks.
#
# Not lld, which hyperi-ci installs only under its version-suffixed name, so
# gcc's `-fuse-ld=lld` finds no `ld.lld` and collect2 fails the link outright.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic", "-C", "link-arg=-fuse-ld=mold"]

# Untargeted local builds get the build host's own features. The per-target
# sections above win whenever `--target` is passed, which is what CI does.
[build]
rustflags = ["-C", "target-cpu=native"]
